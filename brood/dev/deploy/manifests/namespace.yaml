# Метка владения: brood deploy server не пишет в namespace brood, который
# завёл кто-то другой. ate.dev/api-access пускает поды namespace к ateapi
# ate-system (его NetworkPolicy), без неё проекты панели не дозвонятся.
apiVersion: v1
kind: Namespace
metadata:
  name: brood
  labels:
    app.kubernetes.io/managed-by: brood
    ate.dev/api-access: "true"
---
# Go-сервер использует историческое имя django: этот точный принципал
# brood/django уже разрешён в ateapi и atenet-router. Переименование требует
# отдельной миграции доверия; Python runtime за этим именем больше нет.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: django
  namespace: brood
