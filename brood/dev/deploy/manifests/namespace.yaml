# Метка владения: brood deploy server не пишет в namespace brood, который
# завёл кто-то другой. ate.dev/api-access пускает поды namespace к ateapi
# ate-system (его NetworkPolicy), без неё проекты панели не дозвонятся.
apiVersion: v1
kind: Namespace
metadata:
  name: brood
  labels:
    app.kubernetes.io/managed-by: brood
    ate.dev/api-access: "true"
---
# Под django ходит в ateapi как самостоятельный принципал, а не как общий
# ate-client: у того токен заминтовал бы кто угодно с RBAC на его ServiceAccount.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: django
  namespace: brood
