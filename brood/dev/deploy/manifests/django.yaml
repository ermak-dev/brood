# Django brood под gunicorn. Снаружи до него доходят только через вход (edge):
# он снимает TLS и ставит X-Forwarded-Proto, которому Django верит, поэтому
# NetworkPolicy пускает к нему только edge.
apiVersion: v1
kind: Service
metadata:
  name: django
spec:
  selector:
    app: django
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: django
spec:
  replicas: 1
  selector:
    matchLabels:
      app: django
  template:
    metadata:
      labels:
        app: django
    spec:
      # Без service links: Kubernetes кладёт в под переменные Service'ов в
      # духе docker link, и Service postgres дал бы POSTGRES_PORT=tcp://...
      # поверх настройки порта базы.
      enableServiceLinks: false
      serviceAccountName: django
      volumes:
        # Токен с audience api.ate-system.svc и доверенный корень ateapi:
        # ClusterTrustBundle signer'а servicedns.podcert.ate.dev/identity,
        # live-серия -- действующий корень (см. internal/ateclient/builder.go
        # Substrate). kubelet ротирует их на месте.
        - name: ateapi-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: api.ate-system.svc
                  expirationSeconds: 3600
                  path: token
              - clusterTrustBundle:
                  signerName: servicedns.podcert.ate.dev/identity
                  labelSelector:
                    matchLabels:
                      podcert.ate.dev/canarying: live
                  path: trust-bundle.pem
      initContainers:
        - name: migrate
          image: brood-server
          args: ["migrate", "--noinput"]
          envFrom:
            - secretRef:
                name: brood-env
          env: &env
            - name: DJANGO_DEBUG
              value: "0"
            - name: POSTGRES_HOST
              value: postgres
            - name: POSTGRES_DB
              value: brood
            - name: POSTGRES_USER
              value: brood
            # Клиент проектов (brood/server/ateapi): projected-том выше.
            - name: ATEAPI_TOKEN
              value: /var/run/ateapi/token
            - name: ATEAPI_CA
              value: /var/run/ateapi/trust-bundle.pem
            # Kubernetes -- отдельный audience и обычный ротируемый токен SA.
            - name: KUBE_API_URL
              value: https://kubernetes.default.svc
            - name: KUBE_API_TOKEN
              value: /var/run/secrets/kubernetes.io/serviceaccount/token
            - name: KUBE_API_CA
              value: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        # Учётка администратора видна только этому контейнеру.
        - name: ensureadmin
          image: brood-server
          args: ["ensureadmin"]
          envFrom:
            - secretRef:
                name: brood-env
            - secretRef:
                name: brood-admin
          env: *env
      containers:
        - name: django
          image: brood-server
          args: ["serve", "--bind", "0.0.0.0:8000"]
          ports:
            - name: http
              containerPort: 8000
          volumeMounts:
            - name: ateapi-token
              mountPath: /var/run/ateapi
              readOnly: true
          # /healthz отвечает до проверки Host: у kubelet её нет.
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          envFrom:
            - secretRef:
                name: brood-env
          env: *env
---
# Egress django: DNS, только ateapi в ate-system (443) и postgres. Без DNS
# не резолвится даже postgres: egress-политика режет и его запросы к CoreDNS.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: django-egress
spec:
  podSelector:
    matchLabels:
      app: django
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ate-system
      ports:
        - port: 443
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: django
spec:
  podSelector:
    matchLabels:
      app: django
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: edge
      ports:
        - port: 8000
