# Вход сервера brood: TLS снимается здесь, Django -- за ним на 127.0.0.1:8000.
server {
    listen 8080;
    # Проба готовности kubelet ходит по http: ей -- без редиректа.
    location = /healthz {
        proxy_pass http://127.0.0.1:8000;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 8443 ssl;
    http2 on;
    ssl_certificate /etc/nginx/tls/tls.crt;
    ssl_certificate_key /etc/nginx/tls/tls.key;

    location / {
        proxy_pass http://127.0.0.1:8000;
        # Host как прислал клиент, с портом: $host порт теряет, и на
        # нестандартном порту не сошлась бы проверка Origin при входе.
        proxy_set_header Host $http_host;
        # Django верит этому заголовку (SECURE_PROXY_SSL_HEADER): ставим его
        # сами, клиентский затирается.
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
