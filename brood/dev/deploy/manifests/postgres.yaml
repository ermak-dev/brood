# База сервера brood: свой экземпляр, как bundled Postgres Substrate
# (manifests/ate-install/postgres), тем же образом -- он уже на узле. База
# Substrate в ate-system не наша: её pg_hba пускает только его пользователей.
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      # Образ postgres сам читает POSTGRES_*: переменные Service'ов ему ни к чему.
      enableServiceLinks: false
      containers:
        - name: postgres
          image: postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
          env:
            - name: POSTGRES_DB
              value: brood
            - name: POSTGRES_USER
              value: brood
            # Пароль читается только при первом initdb: сменить его потом --
            # ALTER USER в базе, а не правка .env.
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: brood-env
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "brood", "-d", "brood"]
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: django
      ports:
        - port: 5432
