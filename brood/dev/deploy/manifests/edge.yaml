# Вход brood: nginx с TLS и панелью (brood/dev/deploy/edge). NodePort'ы -- те,
# что kind публикует на хост стенда (EDGE в brood/dev/substrate/local.py).
# Отдельно от Django и прокси: их перекатка не рвёт стримы LLM на входе.
apiVersion: v1
kind: Service
metadata:
  name: edge
spec:
  type: NodePort
  selector:
    app: edge
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
    - name: https
      port: 443
      targetPort: https
      nodePort: 30443
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: edge
  template:
    metadata:
      labels:
        app: edge
    spec:
      enableServiceLinks: false
      securityContext:
        # Группа nginx-unprivileged: ключ TLS читает только она (defaultMode).
        fsGroup: 101
      containers:
        - name: nginx
          image: brood-edge
          ports:
            - name: http
              containerPort: 8080
            - name: https
              containerPort: 8443
          env:
            # Entrypoint nginx подставляет в шаблон только эти переменные.
            - name: NGINX_ENVSUBST_FILTER
              value: ^CLIPROXY_
            - name: CLIPROXY_MANAGEMENT_KEY
              valueFrom:
                secretKeyRef:
                  name: brood-cliproxy
                  key: CLIPROXY_MANAGEMENT_KEY
          readinessProbe:
            httpGet:
              path: /edge-healthz
              port: http
            periodSeconds: 5
          volumeMounts:
            - name: tls
              mountPath: /etc/nginx/tls
              readOnly: true
      volumes:
        - name: tls
          secret:
            secretName: brood-tls
            defaultMode: 0440
