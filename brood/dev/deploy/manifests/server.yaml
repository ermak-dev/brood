# Сервер brood: Django под gunicorn на 127.0.0.1:8000 и nginx перед ним в
# одном поде. nginx снимает TLS и отдаёт http -> https. NodePort'ы -- те, что
# kind публикует на хост стенда (EDGE в brood/dev/substrate/local.py).
apiVersion: v1
kind: Service
metadata:
  name: brood-server
spec:
  type: NodePort
  selector:
    app: brood-server
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
    - name: https
      port: 443
      targetPort: https
      nodePort: 30443
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: brood-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: brood-server
  template:
    metadata:
      labels:
        app: brood-server
    spec:
      # Без service links: Kubernetes кладёт в под переменные Service'ов в
      # духе docker link, и Service postgres дал бы POSTGRES_PORT=tcp://...
      # поверх настройки порта базы.
      enableServiceLinks: false
      securityContext:
        # Группа nginx-unprivileged: ключ TLS читает только она (defaultMode).
        fsGroup: 101
      initContainers:
        - name: migrate
          image: brood-server
          args: ["migrate", "--noinput"]
          envFrom:
            - secretRef:
                name: brood-env
          env: &env
            - name: DJANGO_DEBUG
              value: "0"
            - name: POSTGRES_HOST
              value: postgres
            - name: POSTGRES_DB
              value: brood
            - name: POSTGRES_USER
              value: brood
        # Учётка администратора видна только этому контейнеру.
        - name: ensureadmin
          image: brood-server
          args: ["ensureadmin"]
          envFrom:
            - secretRef:
                name: brood-env
            - secretRef:
                name: brood-admin
          env: *env
      containers:
        - name: django
          image: brood-server
          args: ["serve", "--bind", "127.0.0.1:8000"]
          envFrom:
            - secretRef:
                name: brood-env
          env: *env
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.30-alpine@sha256:f5116ed4606f3eb015dd4a8e28cb9b351476dc0ad4bc6e9f93b19cec130cdf03
          ports:
            - name: http
              containerPort: 8080
            - name: https
              containerPort: 8443
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          volumeMounts:
            - name: nginx
              mountPath: /etc/nginx/conf.d
              readOnly: true
            - name: tls
              mountPath: /etc/nginx/tls
              readOnly: true
      volumes:
        - name: nginx
          configMap:
            name: brood-nginx
        - name: tls
          secret:
            secretName: brood-tls
            defaultMode: 0440
