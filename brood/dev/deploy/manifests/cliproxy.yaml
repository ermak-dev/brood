# CLIProxyAPI: LLM-прокси установки, официальный образ. Ключ management --
# MANAGEMENT_PASSWORD из Secret, а не secret-key в config.yaml: конфиг правит
# панель, и её сохранение не должно терять ключ. С этой переменной прокси
# пускает management не только с петли, поэтому NetworkPolicy пускает к нему
# только вход (edge): тот проверяет сессию brood и ставит ключ сам.
apiVersion: v1
kind: Service
metadata:
  name: cliproxy
spec:
  selector:
    app: cliproxy
  ports:
    - name: http
      port: 8317
      targetPort: http
---
# Состояние прокси: config.yaml (его пишет панель), auths/ с аккаунтами
# провайдеров, журналы, плагины.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cliproxy-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cliproxy
spec:
  replicas: 1
  # Два экземпляра над одним каталогом писали бы config.yaml и auths/ наперегонки.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: cliproxy
  template:
    metadata:
      labels:
        app: cliproxy
    spec:
      enableServiceLinks: false
      initContainers:
        # Первый config.yaml -- из cliproxy-config.yaml с клиентским ключом;
        # дальше файл живёт панелью, и выкладка его не трогает. Без единого
        # ключа в access.api-keys прокси открыт всем, поэтому ключ обязателен.
        - name: seed
          image: eceasy/cli-proxy-api:v8.0.41@sha256:b0fe699ae1aea9e8bb7c0525080f702957b96f178a686bd45d0bd749bf3cd156
          command:
            - /bin/sh
            - -ec
            - |
              mkdir -p /data/auths /data/plugins
              if [ ! -f /data/config.yaml ]; then
                sed "s|@CLIPROXY_CLIENT_KEY@|${CLIPROXY_CLIENT_KEY}|" /seed/config.yaml >/data/config.yaml.new
                mv /data/config.yaml.new /data/config.yaml
                echo "config.yaml seeded"
              else
                echo "config.yaml exists: kept"
              fi
          env:
            - name: CLIPROXY_CLIENT_KEY
              valueFrom:
                secretKeyRef:
                  name: brood-cliproxy
                  key: CLIPROXY_CLIENT_KEY
          volumeMounts:
            - name: data
              mountPath: /data
            - name: seed
              mountPath: /seed
              readOnly: true
      containers:
        - name: cliproxy
          image: eceasy/cli-proxy-api:v8.0.41@sha256:b0fe699ae1aea9e8bb7c0525080f702957b96f178a686bd45d0bd749bf3cd156
          command: ["./CLIProxyAPI", "-config", "/data/config.yaml"]
          ports:
            - name: http
              containerPort: 8317
          env:
            - name: MANAGEMENT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: brood-cliproxy
                  key: CLIPROXY_MANAGEMENT_KEY
            # Журналы -- в /data/logs, рядом с остальным состоянием.
            - name: WRITABLE_PATH
              value: /data
            # Образ выставляет Asia/Shanghai; журналы стенда -- в UTC.
            - name: TZ
              value: UTC
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: cliproxy-data
        - name: seed
          configMap:
            name: cliproxy-seed
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cliproxy
spec:
  podSelector:
    matchLabels:
      app: cliproxy
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: edge
      ports:
        - port: 8317
