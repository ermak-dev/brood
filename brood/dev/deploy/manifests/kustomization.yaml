# База kustomize сервера brood. Выкладка дописывает к ней оверлей во
# временном каталоге: образ по digest и Secret'ы из .env и secrets/
# (brood/dev/deploy/server.py).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: brood
resources:
  - namespace.yaml
  - postgres.yaml
  - server.yaml
configMapGenerator:
  - name: brood-nginx
    files:
      - default.conf=nginx.conf
