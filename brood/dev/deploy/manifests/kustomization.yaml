# База kustomize сервера brood. Выкладка дописывает к ней оверлей во
# временном каталоге: образы по digest и Secret'ы из .env и secrets/
# (brood/dev/deploy/server.py).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: brood
resources:
  - namespace.yaml
  - postgres.yaml
  - django.yaml
  - cliproxy.yaml
  - edge.yaml
configMapGenerator:
  - name: cliproxy-seed
    files:
      - config.yaml=cliproxy-config.yaml
