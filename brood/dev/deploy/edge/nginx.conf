worker_processes auto;
pid /tmp/nginx.pid;
# URL может содержать одноразовый ticket: не пишем запросы даже при обычных ошибках.
error_log /dev/stderr crit;

events {
    worker_connections 1024;
}

http {
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        "" close;
    }

    server {
        listen 8080;
        return 301 https://$http_host$request_uri;
    }

    server {
        listen 8443 ssl;
        http2 on;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_certificate /etc/nginx/tls/tls.crt;
        ssl_certificate_key /etc/nginx/tls/tls.key;
        client_max_body_size 64m;

        # Включая React, API и actor-view: только Go решает маршруты и авторизацию.
        location / {
            proxy_pass https://brood-go.brood.svc:8443;
            proxy_ssl_verify on;
            proxy_ssl_trusted_certificate /etc/nginx/tls/tls.crt;
            proxy_ssl_server_name on;
            # Сертификат стенда содержит исторический SAN brood, а не имя Service.
            proxy_ssl_name brood;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Origin $http_origin;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
