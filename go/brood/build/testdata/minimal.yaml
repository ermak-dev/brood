apiVersion: brood.dev/v1alpha1
name: example
defaultTarget: development
sources:
  project:
    type: project
    destination: project
environments:
  python:
    sources: [project]
    build:
      dockerfile: project/environment/Dockerfile
      platform: linux/amd64
templates:
  python:
    environment: python
    network: offline
    actor:
      resources:
        limits:
          cpuMillicores: '1000'
          memoryBytes: '1073741824'
      containers:
        - name: main
          command: [python3]
          args: [--version]
networks:
  offline: {}
targets:
  development:
    template: python
