# Тестовый граф конвейера для эпика #165.
# Схема brood.dev/v1alpha1 (задача #166); прогон — задача #170.
# Узел называет роль, а не способ создания актора (#208).
apiVersion: brood.dev/v1alpha1
name: demo-pipeline
start: prepare
exit: done
nodes:
  prepare:
    type: actor
    role: build
    prompt: |
      Подготовь рабочую ветку demo-pipeline: обнови зависимости
      и сгенерируй fixture-данные. Ветка: demo/pipeline-fixture.
  review:
    type: human
    question: "Подготовка завершена. Продолжать прогон?"
    options:
      - label: "[Y] да"
        outcome: success
      - label: "[N] нет"
        outcome: fail
  build:
    type: actor
    role: build
    prompt: |
      Собери цель development и прогони brood dev test.
      Результат — отчёт в context.report.
  check:
    type: condition
  land:
    type: land
    target: main
  done:
    type: exit
edges:
  - {from: prepare, to: review}
  - {from: review, to: build, condition: "outcome=success"}
  - {from: review, to: done, condition: "outcome=fail"}
  - {from: build, to: check}
  - {from: check, to: land, condition: "context.report=ok"}
  - {from: check, to: review, condition: "context.report!=ok", weight: 1}
  - {from: land, to: done}
goalGates: [land]
retry:
  maxRetries: 1
