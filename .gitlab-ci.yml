# Выкладка main через restricted SSH на каждый push. Проверки временно
# ручные (временный режим CLAUDE.md): запуск кнопкой в конвейере, выкладку
# они не задерживают. Шаги -- скриптами в .ci/, чтобы их видел shellcheck.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"

stages: [test, deploy]

test:
  stage: test
  tags: [docker]
  when: manual
  allow_failure: true
  script:
    - .ci/test.sh

go-test:
  stage: test
  tags: [docker]
  when: manual
  allow_failure: true
  # До 40 минут SDK и 30 минут модулей, затем все проверки и сборки.
  timeout: 90 minutes
  script:
    - bash .ci/go-test.sh
  artifacts:
    paths:
      - go/bin/*.tar.gz
    expire_in: 7 days

# builder идёт по ssh на машину деплоя (docs/DEPLOY.md). Переменные с ключом
# защищённые: конвейер другой ветки их не видит, и rules его сюда не пускает.
deploy:
  stage: deploy
  tags: [docker]
  resource_group: brood-deploy
  cache:
    key:
      prefix: brood-deploy-claude
      files: [brood/dev/pins.json]
    paths: [.brood-ci-cache/claude]
    when: on_success
  # Холодная сборка панели и Go-модуля загружает все зависимости.
  timeout: 90 minutes
  needs: []
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - .ci/deploy.sh
