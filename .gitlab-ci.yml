# Пайплайн brood: проверки на каждый push, выкладка зелёного main. Шаги --
# скриптами в .ci/, чтобы их видел shellcheck.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"

stages: [test, deploy]

test:
  stage: test
  tags: [docker]
  script:
    - .ci/test.sh

# builder идёт по ssh на машину деплоя (docs/DEPLOY.md). Переменные с ключом
# защищённые: конвейер другой ветки их не видит, и rules его сюда не пускает.
deploy:
  stage: deploy
  tags: [docker]
  resource_group: brood-deploy
  # Первая установка собирает Substrate и тянет образы с нуля.
  timeout: 90 minutes
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - .ci/deploy.sh
